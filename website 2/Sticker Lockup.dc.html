<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:460},&quot;maxWidth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:520,&quot;min&quot;:200,&quot;max&quot;:900,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;idle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  rootRef = React.createRef();
  componentDidMount() {
    const el = this.rootRef.current; if (!el) return;
    this.rm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (this.rm) return;
    this.q = (k) => el.querySelector('[data-k="' + k + '"]');
    ["mascot", "bandB", "line1", "bandR", "line2"].forEach(k => { this.q(k).style.opacity = "0"; });
    this.io = new IntersectionObserver((e) => { if (e[0].isIntersecting) { this.play(); this.io.disconnect(); } }, { threshold: .35 });
    this.io.observe(el);
  }
  componentWillUnmount() { if (this.io) this.io.disconnect(); (this.anims || []).forEach(a => a.cancel()); }
  play() {
    (this.anims || []).forEach(a => a.cancel());
    const sp = "cubic-bezier(.34,1.56,.64,1)", out = "cubic-bezier(.22,.76,.28,1)", f = { fill: "both" };
    const A = (k, kf, o) => { const n = this.q(k); n.style.opacity = ""; return n.animate(kf, Object.assign({}, f, o)); };
    this.anims = [
      A("mascot", [{ opacity: 0, transform: "translateY(-40%) scale(.55) rotate(-25deg)" }, { opacity: 1, transform: "translateY(0) scale(1) rotate(0deg)" }], { duration: 750, easing: sp }),
      A("bandB", [{ clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0)" }], { duration: 380, delay: 420, easing: out }),
      A("line1", [{ opacity: 0, transform: "scale(.4) rotate(4deg)" }, { opacity: 1, transform: "scale(1) rotate(0deg)" }], { duration: 520, delay: 640, easing: sp }),
      A("bandR", [{ clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)" }], { duration: 380, delay: 820, easing: out }),
      A("line2", [{ opacity: 0, transform: "scale(.4) rotate(-4deg)" }, { opacity: 1, transform: "scale(1) rotate(0deg)" }], { duration: 560, delay: 1040, easing: sp })
    ];
    if (this.props.idle !== false) {
      this.anims.push(this.q("mascot").animate([{ transform: "rotate(0deg) translateY(0)" }, { transform: "rotate(-4deg) translateY(-2%)" }, { transform: "rotate(3deg) translateY(0)" }, { transform: "rotate(0deg) translateY(0)" }], { duration: 3200, delay: 1700, iterations: Infinity, easing: "ease-in-out", composite: "add" }));
    }
  }
  renderVals() {
    return {
      rootRef: this.rootRef,
      maxW: (this.props.maxWidth ?? 520) + "px",
      replay: () => { if (!this.rm && this.q) this.play(); }
    };
  }
}
